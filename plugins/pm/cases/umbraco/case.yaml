id: umbraco
name: Umbraco
tier: core
regression_case: true
persona: Regional content-operations editor
mandate: Reduce rework between content creation and publication
product_summary: >-
  Umbraco is a free, open-source content management system (CMS): the software that
  organisations use to build and run websites. Marketing teams, editors and web agencies use it
  to write pages, upload images and files, and publish in one or more languages. The
  "backoffice" is the password-protected editing screen where that everyday work
  happens; the public website is a separate layer built on top of it.
repositories:
  - role: primary
    owner_repo: umbraco/Umbraco-CMS
    url: https://github.com/umbraco/Umbraco-CMS
    default_branch: main
    pinned_sha: 65454d935063ced339687c6620d93e3fbbc49320
    pinned_at: "2026-09-17"
    license: MIT
    clone_to: sources/primary
    sparse_paths:
      - src/Umbraco.Web.UI.Client/src/packages/documents
      - src/Umbraco.Web.UI.Client/src/packages/content
      - src/Umbraco.Web.UI.Client/src/packages/media
      - src/Umbraco.Web.UI.Client/src/packages/language
      - src/Umbraco.Web.UI.Client/src/packages/core
      - src/Umbraco.Web.UI.Client/src/assets/lang
      - src/Umbraco.Web.UI.Client/docs
      - src/Umbraco.Core/EmbeddedResources/Lang
lanes:
  - id: draft-to-publish
    name: Draft to publish
    surface: desktop backoffice
    viewport: { width: 1440, height: 900 }
    territory: The path a page takes inside the content editing screen from first draft through save, preview, schedule and publish.
    repo_entry_points:
      - src/Umbraco.Web.UI.Client/src/packages/documents/documents/workspace
      - src/Umbraco.Web.UI.Client/src/packages/documents/documents/publishing
      - src/Umbraco.Web.UI.Client/src/packages/documents/documents/modals/save-modal
      - src/Umbraco.Web.UI.Client/src/packages/content/content/workspace
  - id: media-reuse
    name: Media reuse
    surface: desktop backoffice
    viewport: { width: 1440, height: 900 }
    territory: How images and files are uploaded, browsed in the media library, picked into pages and tracked where they are used.
    repo_entry_points:
      - src/Umbraco.Web.UI.Client/src/packages/media/media/collection
      - src/Umbraco.Web.UI.Client/src/packages/media/media/property-editors/media-picker
      - src/Umbraco.Web.UI.Client/src/packages/media/media/dropzone
      - src/Umbraco.Web.UI.Client/src/packages/media/media/reference
  - id: validation-and-localization
    name: Validation and localization
    surface: desktop backoffice
    viewport: { width: 1440, height: 900 }
    territory: How the editing screen reports required or invalid fields, and how one page is edited across several languages (called "variants").
    repo_entry_points:
      - src/Umbraco.Web.UI.Client/src/packages/core/validation
      - src/Umbraco.Web.UI.Client/src/packages/content/content/variant-picker
      - src/Umbraco.Web.UI.Client/src/packages/language
      - src/Umbraco.Web.UI.Client/src/packages/core/localization
      - src/Umbraco.Web.UI.Client/src/assets/lang
      - src/Umbraco.Core/EmbeddedResources/Lang
exclusions:
  - No changes to the rendering/delivery pipeline (the part that serves pages to website visitors) or to the database schema.
  - No commercial add-ons (Umbraco Forms, Umbraco Deploy, Umbraco Cloud) as dependencies.
  - No marketplace packages (third-party extensions) as dependencies.
synthetic_data_rules:
  - Use only invented site names, page titles, media file names and people; never real client, customer or employee content.
  - Prefer clearly fictional brands (for example "Northwind Regional Tourism" or "Harbourlight Council") so nothing can be mistaken for a real organisation.
  - Keep example text short and neutral; no real addresses, phone numbers, email addresses or personal data.
  - When showing several languages, use real language names (English, Danish, German, French) but invented translated copy; do not paste text from real websites.
  - Media examples should be described by name and type (for example "hero-harbour-2400.jpg", "annual-report.pdf"); do not embed real photographs or logos.
public_channels:
  - { type: github-issues, url: https://github.com/umbraco/Umbraco-CMS/issues, note: "Bug reports and feature requests; filter by labels and search for backoffice terms" }
  - { type: github-discussions, url: https://github.com/umbraco/Umbraco-CMS/discussions, note: "Longer design conversations and RFC-style proposals from maintainers and community" }
  - { type: official-docs, url: https://docs.umbraco.com/umbraco-cms, note: "Official documentation; the Fundamentals section describes the backoffice as designed" }
  - { type: releases, url: https://github.com/umbraco/Umbraco-CMS/releases, note: "Release notes per version; useful for seeing what changed recently in the editing experience" }
  - { type: forum, url: https://forum.umbraco.com/, note: "Official Discourse community forum; good for how-to questions and editor complaints" }
  - { type: review-site, url: https://slashdot.org/software/p/Umbraco/, note: "Third-party software directory with user reviews; treat ratings as anecdotal" }
feeds:
  github_issues_top: "https://api.github.com/search/issues?q=repo:umbraco/Umbraco-CMS+is:issue+{query}&sort=reactions-%2B1&per_page=10"
  github_issues_top_html: "https://github.com/umbraco/Umbraco-CMS/issues?q=is%3Aissue+{query}+sort%3Areactions-%2B1-desc"   # same order as the API; use when the API returns 403 or 429
  github_issues_top_companion: null
  github_discussions_top: "https://github.com/umbraco/Umbraco-CMS/discussions?discussions_q={query}+sort%3Atop"
  forum_search_json: "https://forum.umbraco.com/search.json?q={query}"
  lemmy_search: "https://lemmy.world/api/v3/search?q={query}&type_=Posts&sort=TopYear&limit=10"
  lemmy_communities: []   # umbraco_community@lemmy.world exists but has no posts
  mastodon_tags:
    - { instance: fosstodon.org, tag: umbraco, url: "https://fosstodon.org/api/v1/timelines/tag/umbraco?limit=20" }
    - { instance: mastodon.social, tag: umbraco, url: "https://mastodon.social/api/v1/timelines/tag/umbraco?limit=20" }
  hackernews_search: "https://hn.algolia.com/api/v1/search?query={query}&tags=story&hitsPerPage=10"
  app_store_reviews: []
  adoption:
    - { type: github-repo, url: "https://api.github.com/repos/umbraco/Umbraco-CMS", fields: "stargazers_count, open_issues_count, pushed_at" }
    - { type: nuget, url: "https://azuresearch-usnc.nuget.org/query?q=packageid:Umbraco.Cms&prerelease=false", fields: "totalDownloads" }
  competitors:
    - { name: "Storyblok", page: "https://www.storyblok.com/pricing", wayback: "https://archive.org/wayback/available?url=storyblok.com/pricing&timestamp={yyyymmdd}" }
    - { name: "WordPress.com", page: "https://wordpress.com/pricing/", wayback: "https://archive.org/wayback/available?url=wordpress.com/pricing&timestamp={yyyymmdd}" }
    - { name: "Kentico", page: "https://www.kentico.com/platform/how-to-buy", wayback: "https://archive.org/wayback/available?url=www.kentico.com/platform/how-to-buy&timestamp={yyyymmdd}" }
    - { name: "Sanity", page: "https://www.sanity.io/pricing", wayback: "https://archive.org/wayback/available?url=www.sanity.io/pricing&timestamp={yyyymmdd}" }
  reddit_rss_optional: "https://www.reddit.com/r/umbraco.rss"   # facilitator opt-in only; Claude Code's fetch tool refuses reddit.com; read with curl if the facilitator says so
